# KOPS local stack (D-07, F-06): `make up` -> http://127.0.0.1:8765
#   kops-build      one shot (image kops-app): build the DW from raw-docs, run every check, render the dashboards (exits
#                   non-zero if a check fails, and the app then does not start)
#   kops-dashboard  web app (image kops-app: login, data API, notifications, chatbot), starts after kops-build succeeded
#   kops-tools      image kops-tools (Chromium + Playwright), only on demand: make check-ui, make report
# raw-docs is mounted read-only; the DW output stays in volume kops_build (rebuildable), users / sessions / notifications /
# chat / settings in volume kops_state (kept by make rebuild and make clean; make reset-state asks first).
# Secrets (admin password, ANTHROPIC_API_KEY) come from .env at run time (optional file).
name: kops

x-common: &common
  image: kops-app:local
  build:
    context: ./dw
    target: app
  volumes:
    - ./raw-docs:/data/raw-docs:ro
    - ./analys-docs/open_questions.md:/data/open_questions.md:ro   # question codes / titles (read only)
    - ./branding:/app/branding:ro          # logo / favicon: replace the files, reload the page (no rebuild)
    - kops_build:/app/build
    - kops_state:/app/state
  env_file:
    - path: .env
      required: false
  environment:
    KOPS_SIM: ${KOPS_SIM:-1}
    KOPS_TODAY: ${KOPS_TODAY:-}
    KOPS_QUESTIONS_FILE: /data/open_questions.md
    KOPS_BRANDING: /app/branding
    KOPS_VERSION: ${KOPS_VERSION:-dev}

services:
  kops-build:
    <<: *common
    command: ["sh", "-c", "python -m kops_dw build && python -m kops_dw test && python -m kops_dw dashboard"]
    restart: "no"

  kops-dashboard:
    <<: *common
    command: ["python", "-m", "kops_dw", "serve", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"          # this machine only
    depends_on:
      kops-build:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  kops-tools:
    <<: *common
    image: kops-tools:local
    build:
      context: ./dw
      target: tools
    profiles: ["tools"]
    restart: "no"

volumes:
  kops_build:
  kops_state:
