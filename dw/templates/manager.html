<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOPS Quản lý</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--text:#16191d;--text-2:#555d68;--line:#e2e5ea;--line-strong:#c9ced6;
  --accent:#2f5bd3;--good:#1f8a4c;--warning:#b7791f;--critical:#c0362c;--neutral:#7a838f;--syn:#8a5cc7;
  --s1:#2f5bd3;--s2:#d9822b;--s3:#2a9d8f;--s4:#c0362c;--s5:#8a5cc7;--s6:#7a838f;--s7:#b5838d;--s8:#3d8bd9;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111418;--surface:#191d22;--surface-2:#20252b;--text:#e8ebef;--text-2:#a3abb5;--line:#2c3239;--line-strong:#3c444d;
  --accent:#7b9cf0;--good:#4cc27e;--warning:#e0a64a;--critical:#ef6b61;--neutral:#99a2ad;--syn:#b18ae8;
  --s1:#7b9cf0;--s2:#efa35c;--s3:#56c2b4;--s4:#ef6b61;--s5:#b18ae8;--s6:#99a2ad;--s7:#d6a2ac;--s8:#6fb1f0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418;--surface:#191d22;--surface-2:#20252b;--text:#e8ebef;--text-2:#a3abb5;--line:#2c3239;--line-strong:#3c444d;
  --accent:#7b9cf0;--good:#4cc27e;--warning:#e0a64a;--critical:#ef6b61;--neutral:#99a2ad;--syn:#b18ae8;
  --s1:#7b9cf0;--s2:#efa35c;--s3:#56c2b4;--s4:#ef6b61;--s5:#b18ae8;--s6:#99a2ad;--s7:#d6a2ac;--s8:#6fb1f0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top{max-width:1360px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;margin-right:6px}.brand small{font-weight:400;color:var(--text-2);margin-left:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1}
select,input[type=search]{background:var(--surface-2);color:var(--text);border:1px solid var(--line-strong);border-radius:6px;padding:5px 8px;font:inherit;max-width:180px}
label.tog{display:flex;align-items:center;gap:6px;color:var(--text-2);white-space:nowrap}
button.icon{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:6px;padding:4px 9px;cursor:pointer;font:inherit}
nav{max-width:1360px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--text-2);padding:9px 11px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1360px;margin:0 auto;padding:18px 20px 60px}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text-2);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:help}
.kpi .l{color:var(--text-2);font-size:12.5px}.kpi .v{font-size:23px;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .d{font-size:12px;color:var(--text-2)}.up{color:var(--good)}.down{color:var(--critical)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.grid.g1{grid-template-columns:1fr}.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.card h3{margin:0 0 2px;font-size:14.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.card .sub{margin:0 0 8px;color:var(--text-2);font-size:12.5px}
.chart{width:100%;height:300px}.chart.tall{height:420px}.chart.small{height:150px}
.qref{text-decoration:underline dotted;cursor:help}
.syn{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--syn) 18%,transparent);color:var(--syn);border:1px solid color-mix(in srgb,var(--syn) 40%,transparent);cursor:help}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--text-2);font-weight:600;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line-strong);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.note{color:var(--text-2);font-size:12.5px}.pager{display:flex;gap:8px;align-items:center;margin-top:6px}
.empty{color:var(--text-2);padding:24px 0;text-align:center}
.s360head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.heat td{text-align:center;font-size:12px;font-weight:600}
@media (max-width:820px){.grid,.grid.g3{grid-template-columns:1fr}.top{padding:8px 14px}nav{padding:0 14px}main{padding:14px}
  select,input[type=search]{max-width:140px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.chart.tall{height:360px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">KOPS<small>Quản lý · <span id="built"></span></small></div>
    <div class="filters">
      <select id="fSeason" aria-label="Mùa"></select>
      <select id="fCustomer" aria-label="Khách"></select>
      <select id="fBrand" aria-label="Brand"></select>
      <select id="fFactory" aria-label="Nhà máy"></select>
      <label class="tog"><input type="checkbox" id="fSyn"> Hiện dữ liệu giả định</label>
    </div>
    <a class="note" href="dashboard.html">Dashboard phân tích →</a>
    <button class="icon" id="themeBtn" title="Sáng / tối" aria-label="Đổi giao diện sáng / tối">☾</button>
  </div>
  <nav id="tabs" role="tablist"></nav>
</header>
<main id="main"><div class="empty">Đang tải…</div></main>
<script src="vendor/echarts-5.5.1.min.js"></script>
<script>
'use strict';
/* ================================================================ data */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('vi-VN'), nf1 = new Intl.NumberFormat('vi-VN', {maximumFractionDigits: 1});
const fmt = v => v == null || v === '' || Number.isNaN(v) ? '–' : (typeof v === 'number' ? nf.format(Math.round(v * 10) / 10) : esc(v));
const pct = (a, b) => b ? nf1.format(100 * a / b) + '%' : '–';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const rowsOf = t => (t?.rows || []).map(r => Object.fromEntries(t.cols.map((c, i) => [c, r[i]])));
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const group = (a, key, val) => { const m = new Map(); for (const x of a) { const k = key(x); m.set(k, (m.get(k) || 0) + (+val(x) || 0)); } return m; };
const uniq = a => [...new Set(a.filter(x => x != null && x !== ''))].sort();
const ALL = '__all__';
const NOANIM = new URLSearchParams(location.search).get('noanim') === '1';     // screenshots (self-check)
let IDX = null, COMMON = null, CACHE = {}, D = {};
const STATE = {season: null, customer: ALL, brand: ALL, factory: ALL, syn: true, tab: 'actions', style: null};
const ASM = {'ASM-SIM-01': '2 mùa trước giả định từ 26FW/27SS', 'ASM-SIM-02': 'sản lượng ngày giả định (nhà máy không gửi báo cáo)',
  'ASM-SIM-03': 'kết quả kiểm giả định', 'ASM-SIM-04': 'lô xuất giả định (khách chưa gửi Shipment Status)',
  'ASM-SIM-05': 'mã lỗi giả định theo Pareto INPUT DATA', 'ASM-QC-01': 'lỗi = điểm lỗi, tỉ lệ = lỗi ÷ SL kiểm',
  'ASM-QC-02': 'REJECT khi REMARK ghi REJECT', 'ASM-FRESH-01': 'độ tươi tính theo ngày T2–T6'};
/* question code + title come from analys-docs/open_questions.md at render time (index.json, kops_dw/questions.py) */
const qOf = i => IDX?.questions?.assumptions?.[i];
const qTitle = c => c ? c + (IDX?.questions?.questions?.[c] ? '. ' + IDX.questions.questions[c] : '') : '';
const qref = c => `<span class="qref" title="${esc(qTitle(c))}">${esc(c)}</span>`;
const qchip = c => `<span class="chip qref" title="${esc('Chờ KLMAS trả lời ' + qTitle(c))}">chờ ${esc(c)}</span>`;
const TOL = () => IDX?.ontime_tol_days ?? 7;
const synChip = (ids, share) => { const qs = uniq((ids || []).map(qOf));
  const tip = (ids || []).map(i => i + ': ' + (ASM[i] || '') + (qOf(i) ? ' — câu hỏi KLMAS ' + qTitle(qOf(i)) : '')).join('\n') || 'dữ liệu giả định';
  return `<span class="syn" title="${esc(tip)}">Giả định${share != null ? ' ' + nf1.format(share) + '%' : ''}${qs.length ? ' · ' + qs.join(', ') : ''}</span>`; };

async function getJSON(u) { const r = await fetch(u, {cache: 'no-cache'}); if (!r.ok) throw new Error(u + ': HTTP ' + r.status); return r.json(); }
async function loadSeasons(list) {
  for (const s of list) if (!CACHE[s]) CACHE[s] = await getJSON('data/mgr/' + encodeURIComponent(s) + '.json');
  D = {};
  for (const part of [COMMON, ...list.map(s => CACHE[s])]) for (const [k, t] of Object.entries(part || {})) (D[k] = D[k] || []).push(...rowsOf(t));
}
const seasonsShown = () => STATE.season === ALL ? IDX.seasons : [STATE.season];

/* ================================================================ filters */
const isSynRow = r => !!(r.is_synthetic || r.style_syn || r.season_syn);
function keep(r, {syn = true} = {}) {
  if (STATE.customer !== ALL && r.customer != null && r.customer !== STATE.customer) return false;
  if (STATE.brand !== ALL && r.brand != null && r.brand !== STATE.brand) return false;
  if (STATE.factory !== ALL && r.factory_code != null && r.factory_code !== STATE.factory) return false;
  if (STATE.season !== ALL && (r.season ?? r.season_code) != null && (r.season ?? r.season_code) !== STATE.season) return false;
  if (syn && !STATE.syn && isSynRow(r)) return false;
  return true;
}
const T = k => (D[k] || []).filter(r => keep(r));
function styles() { return T('styles'); }
function drawFilters() {
  const st = D.styles || [];
  const opt = (sel, vals, all, cur) => { $(sel).innerHTML = `<option value="${ALL}">${all}</option>` + vals.map(v => `<option${v === cur ? ' selected' : ''}>${esc(v)}</option>`).join(''); };
  $('#fSeason').innerHTML = `<option value="${ALL}"${STATE.season === ALL ? ' selected' : ''}>Mùa: tất cả</option>` +
    IDX.seasons.map(s => `<option value="${s}"${s === STATE.season ? ' selected' : ''}>${s}${s.startsWith('25') ? ' (giả định)' : ''}</option>`).join('');
  opt('#fCustomer', uniq(st.map(s => s.customer)), 'Khách: tất cả', STATE.customer);
  opt('#fBrand', uniq(st.filter(s => STATE.customer === ALL || s.customer === STATE.customer).map(s => s.brand)), 'Brand: tất cả', STATE.brand);
  opt('#fFactory', uniq(st.map(s => s.factory_code)), 'Nhà máy: tất cả', STATE.factory);
  $('#fSyn').checked = STATE.syn;
}

/* ================================================================ charts */
const CHARTS = [];
function chart(id, option) { CHARTS.push([id, option]); return `<div class="chart${option._cls ? ' ' + option._cls : ''}" id="${id}"></div>`; }
function base(o) {
  const t = css('--text-2'), l = css('--line');
  return Object.assign({
    animation: !NOANIM,
    textStyle: {color: t, fontFamily: 'system-ui, sans-serif'}, grid: {left: 52, right: 16, top: 30, bottom: 34, containLabel: false},
    color: ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'].map(css),
    tooltip: {trigger: 'axis', backgroundColor: css('--surface'), borderColor: css('--line-strong'), textStyle: {color: css('--text')}},
    legend: {top: 0, textStyle: {color: t}, type: 'scroll'},
    xAxis: {axisLine: {lineStyle: {color: l}}, axisLabel: {color: t}, splitLine: {show: false}},
    yAxis: {axisLine: {lineStyle: {color: l}}, axisLabel: {color: t}, splitLine: {lineStyle: {color: l}}},
  }, o);
}
function drawCharts() {
  for (const [id, opt] of CHARTS) {
    const el = document.getElementById(id); if (!el) continue;
    const c = echarts.getInstanceByDom(el) || echarts.init(el, null, {renderer: 'svg'});
    const {_click, _cls, ...o} = opt;
    c.setOption(base(o), true);
    c.off('click'); if (_click) c.on('click', _click);
  }
}
addEventListener('resize', () => { for (const [id] of CHARTS) { const el = document.getElementById(id); if (el) echarts.getInstanceByDom(el)?.resize(); } });

/* ================================================================ tables */
const TABLES = {};
function table(id, rows, cols, {limit = 15, onClick} = {}) {
  TABLES[id] = {rows, cols, page: 0, limit, onClick};
  return `<div class="tw" id="${id}"></div>`;
}
function drawTable(id) {
  const t = TABLES[id], el = document.getElementById(id); if (!el) return;
  const pages = Math.max(1, Math.ceil(t.rows.length / t.limit)), p = Math.min(t.page, pages - 1);
  const slice = t.rows.slice(p * t.limit, (p + 1) * t.limit);
  el.innerHTML = t.rows.length ? `<table><thead><tr>${t.cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>` +
    slice.map((r, i) => `<tr class="${t.onClick ? 'click' : ''}" data-i="${p * t.limit + i}" ${r._src ? `title="${esc(r._src)}"` : ''}>${t.cols.map(c => `<td class="${c.n ? 'n' : ''}">${c.r ? c.r(r[c.k], r) : fmt(r[c.k])}</td>`).join('')}</tr>`).join('') +
    `</tbody></table>${pages > 1 ? `<div class="pager"><button class="icon" data-pg="-1">‹</button><span class="note">trang ${p + 1}/${pages} · ${nf.format(t.rows.length)} dòng</span><button class="icon" data-pg="1">›</button></div>` : `<div class="note">${nf.format(t.rows.length)} dòng</div>`}`
    : '<div class="empty">Không có dữ liệu cho bộ lọc này</div>';
  t.page = p;
}
document.addEventListener('click', e => {
  const pg = e.target.closest('[data-pg]');
  if (pg) { const id = pg.closest('.tw').id; TABLES[id].page += +pg.dataset.pg; drawTable(id); return; }
  const tr = e.target.closest('tr.click');
  if (tr) { const t = TABLES[tr.closest('.tw').id]; t.onClick(t.rows[+tr.dataset.i]); }
});
const openStyle = nk => { if (!nk) return; STATE.style = nk; showTab('style'); };
const styleCell = (v, r) => `<a href="#" onclick="openStyle('${esc(r.style_nk)}');return false">${esc(v)}</a>${r.style_syn ? ' ' + synChip([r.style_asm]) : ''}`;
const synMark = (v, r, flag, asm) => fmt(v) + (r[flag] ? ' ' + synChip(asm ? [r[asm]] : null) : '');

/* ================================================================ KPIs */
function kpis(st) {
  const act = st.filter(s => s.is_active);
  const shipOk = s => STATE.syn || !s.ship_syn;
  const judged = act.filter(s => s.on_time != null && shipOk(s));
  const order = sum(act, s => s.order_qty), shipped = sum(act.filter(shipOk), s => s.shipped);
  const shippedSyn = sum(act.filter(s => s.ship_syn || s.style_syn), s => s.shipped);
  const qual = T('quality').filter(q => q.source === 'KLMAS');
  const insp = sum(qual, q => q.inspected), defects = sum(qual, q => q.defects);
  const inspSyn = sum(qual.filter(q => q.is_synthetic), q => q.inspected);
  return {styles: act.length, order, shipped, shippedSyn, judged: judged.length, onTime: judged.filter(s => s.on_time).length,
    onTimeTol: judged.filter(s => s.on_time_tol).length, judgedSyn: judged.filter(s => s.ship_syn || s.style_syn).length,
    risk: act.filter(s => s.risk_reason).length, insp, defects, inspSyn,
    pending: sum(st, s => s.pending_proposals), synStyles: act.filter(s => s.style_syn).length,
    delay: judged.length ? sum(judged, s => s.delay_days) / judged.length : null};
}
function prevSeason(s) { if (!s || s === ALL) return null; return String(+s.slice(0, 2) - 1).padStart(2, '0') + s.slice(2); }
function seasonKpi(season) {
  const rows = (COMMON_ROWS.season_summary || []).filter(r => r.season_code === season && (STATE.customer === ALL || r.customer === STATE.customer));
  if (!rows.length) return null;
  const syn = rows.every(r => r.season_syn);
  if (syn && !STATE.syn) return {none: true};
  const g = k => sum(rows, r => r[k + '_real']) + (STATE.syn ? sum(rows, r => r[k + '_syn']) : 0);
  return {syn, order: sum(rows, r => r.order_qty), shipped: g('shipped'), judged: g('judged'), onTime: g('on_time'), onTimeTol: g('on_time_tol')};
}
function kpiTile(label, value, detail, tip, syn) {
  return `<div class="kpi" title="${esc(tip)}"><div class="l">${esc(label)} ${syn || ''}</div><div class="v">${value}</div><div class="d">${detail || ''}</div></div>`;
}
function delta(cur, prev, better = 'up') {
  if (cur == null || prev == null) return '';
  const d = cur - prev; if (Math.abs(d) < 0.05) return '<span>= mùa trước</span>';
  const good = (d > 0) === (better === 'up');
  return `<span class="${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${nf1.format(Math.abs(d))} điểm % so với mùa trước</span>`;
}

/* ================================================================ pages */
let COMMON_ROWS = {};
const PAGES = [['actions', 'Việc cần xử lý'], ['overview', 'Tổng quan'], ['production', 'Tiến độ sản xuất'], ['ship', 'Xuất hàng'], ['quality', 'Chất lượng'],
  ['factory', 'Nhà máy'], ['change', 'Thay đổi & email'], ['style', 'Style 360'], ['health', 'Sức khoẻ dữ liệu']];

/* ---------------------------------------------------------------- actions (E-04) */
const ACT = {PLAN_LATE: 'Kế hoạch trễ', FORECAST_LATE: 'Dự báo trễ', MATERIAL_LATE: 'Vật tư về trễ', APPROVAL_MISSING: 'Thiếu duyệt mẫu',
  DAILY_STALE: 'Thiếu báo cáo ngày', PROPOSAL_PENDING: 'Đề xuất chờ duyệt', FILE_MISMATCH: 'Lệch số giữa file'};
const SEV = {1: ['Nghiêm trọng', '--critical'], 2: ['Cao', '--warning'], 3: ['Trung bình', '--neutral']};
const dshort = d => d ? String(d).slice(8, 10) + '/' + String(d).slice(5, 7) + (String(d).slice(0, 4) !== String(IDX.today || '').slice(0, 4) ? '/' + String(d).slice(2, 4) : '') : '–';
function actReason(a) {
  switch (a.action_type) {
    case 'PLAN_LATE': return a.txt === 'BAL' ? `Kế hoạch: BAL ${fmt(a.n1)} ngày (xong ${dshort(a.d1)}, RDD ${dshort(a.d2)})`
      : `Xong ${dshort(a.d1)} + ${fmt(IDX.ready_buffer ?? 5)} ngày hoàn thiện + vận chuyển > RDD ${dshort(a.d2)} (BAL ${fmt(a.n1)})`;
    case 'FORECAST_LATE': return a.txt === 'ETD_PASSED_NOT_SHIPPED' ? `Đã qua ETD ${dshort(a.d2)} mà chưa xuất đủ` : `Dự báo sẵn sàng ${dshort(a.d1)} + vận chuyển > RDD ${dshort(a.d2)}`;
    case 'MATERIAL_LATE': return `Vật tư ${esc(a.txt || '')} về ${dshort(a.d1)}, sau ngày cắt ${dshort(a.d2)} (${fmt(a.n1)} ngày)`;
    case 'APPROVAL_MISSING': return `Cắt ${dshort(a.d1)} nhưng chưa thấy ${(a.txt || '').split(',').map(x => x === 'FPP_CFMD' ? 'FPP CFMD' : 'DM duyệt').join(' và ')}`;
    case 'DAILY_STALE': return a.d1 ? `${fmt(a.n1)} ngày làm việc chưa gửi báo cáo ngày (cuối ${dshort(a.d1)}); ${fmt(a.txt)} style đang may` : `Chưa từng gửi báo cáo ngày; ${fmt(a.txt)} style đang may`;
    case 'PROPOSAL_PENDING': return `Email đề xuất ${esc(a.txt || '')} (${dshort(a.d1)}), chưa duyệt`;
    case 'FILE_MISMATCH': return a.txt === 'ETD_YEAR' ? `ETD / ngày cắt ${dshort(a.d1)} trước đầu mùa (${dshort(a.d2)}) quá 120 ngày: nghi gõ sai năm` : esc(a.txt || '');
  }
  return esc(a.txt || '');
}
function pageActions() {
  const acts = T('actions');
  const by = group(acts, a => a.action_type, () => 1);
  const crit = acts.filter(a => a.severity === 1).length;
  const cur = IDX.current && STATE.season === IDX.current;
  return `
  <div class="banner">${cur ? `Mùa đang chạy <b>${esc(IDX.current)}</b> (mùa có ETD gần nhất phía trước). ` : ''}Danh sách lấy từ dữ liệu thật (hôm nay = ${esc(IDX.today || '')}); mỗi dòng có lý do, nguồn và mở được Style 360.
    Người phụ trách để trống: KLMAS chưa có bảng phân công ${qchip('Q50')}. ${qchip('Q32')} báo cáo thứ Bảy.</div>
  <div class="kpis">${kpiTile('Nghiêm trọng', fmt(crit), `${fmt(acts.length)} việc`, 'Mức 1: kế hoạch / dự báo trễ, thiếu duyệt mẫu hoặc vật tư trễ khi sắp cắt (≤ 7–14 ngày)')}
    ${Object.entries(ACT).map(([k, l]) => kpiTile(l, fmt(by.get(k) || 0), '', l)).join('')}</div>
  <div class="card"><h3>Việc cần xử lý</h3><p class="sub">xếp theo mức độ rồi hạn; bấm một dòng để mở Style 360 (dòng theo nhà máy: lọc nhà máy)</p>
    ${table('tAct', acts.map(a => ({...a, _src: 'Nguồn: ' + (a.source || '')})), [
      {k: 'severity', l: 'Mức', r: v => `<span class="chip"><i style="background:var(${(SEV[v] || SEV[3])[1]})"></i>${(SEV[v] || SEV[3])[0]}</span>`},
      {k: 'due_date', l: 'Hạn', r: v => dshort(v)}, {k: 'action_type', l: 'Loại', r: v => esc(ACT[v] || v)},
      {k: 'style_no', l: 'Style'}, {k: 'reason', l: 'Lý do', r: (v, r) => actReason(r)}, {k: 'factory_code', l: 'Nhà máy'}, {k: 'customer', l: 'Khách'},
      {k: 'source', l: 'Nguồn', r: v => `<span class="note">${esc(v || '')}</span>`}, {k: 'owner', l: 'Phụ trách', r: () => '–'}],
      {limit: 25, onClick: r => r.style_nk ? openStyle(r.style_nk) : (r.factory_code ? (STATE.factory = r.factory_code, refresh()) : null)})}</div>`;
}

function pageOverview() {
  const st = styles(), k = kpis(st);
  const prev = seasonKpi(prevSeason(STATE.season));
  const ship = k.order ? 100 * k.shipped / k.order : null, ot = k.judged ? 100 * k.onTime / k.judged : null;
  const otTol = k.judged ? 100 * k.onTimeTol / k.judged : null, defR = k.insp ? 100 * k.defects / k.insp : null;
  const prevShip = prev && !prev.none && prev.order ? 100 * prev.shipped / prev.order : null;
  const prevOt = prev && !prev.none && prev.judged ? 100 * prev.onTime / prev.judged : null;
  const synShip = k.shippedSyn && STATE.syn ? synChip(['ASM-SIM-01', 'ASM-SIM-04'], 100 * k.shippedSyn / Math.max(k.shipped, 1)) : '';
  const synJ = k.judgedSyn && STATE.syn ? synChip(['ASM-SIM-01', 'ASM-SIM-04'], 100 * k.judgedSyn / Math.max(k.judged, 1)) : '';
  const synI = k.inspSyn && STATE.syn ? synChip(['ASM-SIM-01', 'ASM-SIM-03', 'ASM-QC-01'], 100 * k.inspSyn / Math.max(k.insp, 1)) : '';
  const synS = k.synStyles && STATE.syn ? synChip(['ASM-SIM-01'], 100 * k.synStyles / Math.max(k.styles, 1)) : '';
  const prevNote = prev == null ? 'chưa có mùa trước' : prev.none ? 'mùa trước chỉ có dữ liệu giả định (đang ẩn)' : (prev.syn ? 'mùa trước là giả định' : '');
  // qty by customer x brand
  const act = st.filter(s => s.is_active);
  const custs = uniq(act.map(s => s.customer)), brands = uniq(act.map(s => s.brand));
  const byCB = brands.map(b => ({name: b, type: 'bar', stack: 'q', data: custs.map(c => sum(act.filter(s => s.customer === c && s.brand === b), s => s.order_qty))}));
  // weekly ETD plan vs shipped
  const wk = T('weekly'), weeks = uniq(wk.map(w => w.week_start));
  const wser = m => { const g = group(wk.filter(x => x.measure === m), x => x.week_start, x => x.qty); return weeks.map(w => g.get(w) || 0); };
  const alerts = act.filter(s => s.risk_reason).sort((a, b) => (a.etd || '').localeCompare(b.etd || '')).slice(0, 10)
    .map(s => ({...s, _src: 'Nguồn: ORDER RECAP (ETD, SL), Shipment Status (đã xuất), báo cáo ngày / Production Status (dự báo)'}));
  return `
  <div class="banner">Mùa ${esc(STATE.season === ALL ? 'tất cả' : STATE.season)}${STATE.customer !== ALL ? ' · ' + esc(STATE.customer) : ''}. Số thật lấy từ file KLMAS (CHALLENGER 26FW là cycle đủ dữ liệu). Ô nào có phần <span class="syn">Giả định</span> thì rê chuột để xem giả định nào (dw/docs/assumptions.md); tắt công tắc để chỉ xem dữ liệu thật.</div>
  <div class="kpis">
    ${kpiTile('SL đặt (pcs)', fmt(k.order), `${fmt(k.styles)} style đang chạy`, 'Σ SL đặt của style còn hiệu lực — ORDER RECAP bản hiện hành', synS)}
    ${kpiTile('Đã xuất', ship == null ? '–' : nf1.format(ship) + '%', `${fmt(k.shipped)} pcs · ${delta(ship, prevShip)}`, 'SL lô SHIPMENT (không gồm mẫu) ÷ SL đặt còn hiệu lực — Shipment Status', synShip)}
    ${kpiTile('Đúng hạn (lô đầu ≤ ETD VN)', ot == null ? '–' : nf1.format(ot) + '%', `≤ ETD + ${TOL()} ngày: ${otTol == null ? '–' : nf1.format(otTol) + '%'} · ${delta(ot, prevOt)} ${prevNote}`, `Số chính: lô đầu tiên có ETD ≤ ETD VN trong ORDER RECAP (quy tắc chặt, PO chốt 23/10). Số phụ: cho trễ ${TOL()} ngày (≤ ETD + ${TOL()} ngày). Chờ KLMAS xác nhận ${qTitle('Q21')}`, (synJ || '') + ' ' + qchip('Q21'))}
    ${kpiTile('Trễ ETD trung bình', k.delay == null ? '–' : nf1.format(k.delay) + ' ngày', `${fmt(k.judged)} style đã xuất`, 'ETD lô đầu − ETD VN (âm = xuất sớm)', synJ)}
    ${kpiTile('Style rủi ro', fmt(k.risk), 'dự báo sau RDD, BAL < 0, hoặc quá ETD chưa xuất', 'Còn hiệu lực, chưa xuất đủ và: ngày sẵn sàng dự báo + 12 ngày > RDD, hoặc BAL kế hoạch < 0, hoặc đã qua ETD — xem metrics.md', '')}
    ${kpiTile('Tỉ lệ lỗi kiểm', defR == null ? '–' : nf1.format(defR) + '%', `${fmt(k.defects)} lỗi / ${fmt(k.insp)} pcs kiểm`, 'Điểm lỗi ÷ SL đã kiểm (bảng kiểm KLMAS dòng D ÷ C) — giả định ASM-QC-01', synI || synChip(['ASM-QC-01']))}
    ${kpiTile('Đề xuất chờ duyệt', fmt(k.pending), 'từ email, chưa áp vào số liệu', 'Thay đổi đọc từ email: luôn PENDING_REVIEW')}
  </div>
  <div class="grid">
    <div class="card"><h3>SL đặt theo khách và brand</h3><p class="sub">bấm một cột để lọc theo khách</p>
      ${chart('cCust', {xAxis: {type: 'category', data: custs, axisLabel: {color: css('--text-2')}}, yAxis: {type: 'value'}, series: byCB,
        _click: p => { STATE.customer = p.name; refresh(); }})}</div>
    <div class="card"><h3>Lịch ETD theo tuần ${STATE.syn && wk.some(w => w.is_synthetic && w.measure !== 'OUTPUT') ? synChip(['ASM-SIM-01', 'ASM-SIM-04']) : ''}</h3><p class="sub">SL theo ETD trong RECAP so với SL đã xuất theo ETD lô</p>
      ${chart('cWeek', {xAxis: {type: 'category', data: weeks}, yAxis: {type: 'value'}, dataZoom: [{type: 'inside'}],
        series: [{name: 'Kế hoạch ETD', type: 'bar', data: wser('ETD_PLAN')}, {name: 'Đã xuất', type: 'line', smooth: true, data: wser('SHIPPED')}]})}</div>
  </div>
  <div class="card"><h3>10 cảnh báo cần xem trước</h3><p class="sub">style rủi ro, sắp theo ETD; bấm để mở Style 360</p>
    ${table('tAlert', alerts, [{k: 'style_no', l: 'Style', r: styleCell}, {k: 'customer', l: 'Khách'}, {k: 'factory_code', l: 'Nhà máy'},
      {k: 'etd', l: 'ETD'}, {k: 'ready_date', l: 'Dự báo xong'}, {k: 'order_qty', l: 'SL', n: 1}, {k: 'shipped', l: 'Đã xuất', n: 1, r: (v, r) => synMark(v, r, 'ship_syn', 'ship_asm')},
      {k: 'risk_reason', l: 'Lý do', r: v => ({FORECAST_AFTER_RDD: 'Dự báo xong sau RDD', PLAN_BAL_NEGATIVE: 'BAL kế hoạch < 0', ETD_PASSED_NOT_SHIPPED: 'Quá ETD, chưa xuất đủ'}[v] || esc(v))}],
      {limit: 10, onClick: r => openStyle(r.style_nk)})}</div>`;
}

function pageProduction() {
  const sc = T('scurve'), days = uniq(sc.map(r => r.day));
  const gp = group(sc, r => r.day, r => r.planned), ga = group(sc, r => r.day, r => r.actual);
  let cp = 0, ca = 0;
  const plan = days.map(d => (cp += gp.get(d) || 0, Math.round(cp)));
  const act = days.map(d => (ca += ga.get(d) || 0, ca));
  const synOut = STATE.syn && sc.some(r => r.is_synthetic && r.actual);
  const st = styles().filter(s => s.is_active && s.ready_date && s.etd && (s.risk_reason || s.shipped < s.order_qty)).sort((a, b) => (b.ready_date > b.etd) - (a.ready_date > a.etd) || a.etd.localeCompare(b.etd)).slice(0, 40);
  const names = st.map(s => s.style_no);
  const wk = T('weekly').filter(w => w.measure === 'OUTPUT'), weeks = uniq(wk.map(w => w.week_start)), facs = uniq(wk.map(w => w.factory_code));
  return `
  <div class="grid g1"><div class="card"><h3>Tiến độ may: kế hoạch và thực tế (lũy kế) ${synOut ? synChip(['ASM-SIM-02']) : ''}</h3>
    <p class="sub">Kế hoạch: SL mỗi style chia đều cho ngày làm việc từ ngày vào chuyền tới ngày xong (PRODUCTION PLAN). Thực tế: Σ sản lượng ngày (báo cáo sản xuất ngày).</p>
    ${chart('cS', {xAxis: {type: 'category', data: days}, yAxis: {type: 'value'}, dataZoom: [{type: 'inside'}, {type: 'slider', height: 18, bottom: 0}], grid: {left: 60, right: 16, top: 30, bottom: 50},
      series: [{name: 'Kế hoạch', type: 'line', showSymbol: false, data: plan, lineStyle: {type: 'dashed'}}, {name: 'Thực tế', type: 'line', showSymbol: false, data: act, areaStyle: {opacity: .12}}], _cls: 'tall'})}</div></div>
  <div class="grid">
    <div class="card"><h3>Dự báo xong so với ETD (40 style cần chú ý)</h3><p class="sub">● ETD VN trong RECAP · ◆ ngày sẵn sàng dự báo; đoạn đỏ = trễ. Bấm để mở Style 360.</p>
      ${chart('cDumb', {grid: {left: 100, right: 16, top: 30, bottom: 30}, tooltip: {trigger: 'item'},
        yAxis: {type: 'category', data: names, inverse: true, axisLabel: {fontSize: 10, color: css('--text-2')}}, xAxis: {type: 'time'},
        series: [{type: 'custom', renderItem: (p, api) => { const y = api.coord([0, api.value(0)])[1], a = api.coord([api.value(1), 0])[0], b = api.coord([api.value(2), 0])[0];
            return {type: 'line', shape: {x1: a, y1: y, x2: b, y2: y}, style: {stroke: api.value(2) > api.value(1) ? css('--critical') : css('--good'), lineWidth: 3}}; },
          data: st.map((s, i) => [i, +new Date(s.etd), +new Date(s.ready_date)]), encode: {x: [1, 2], y: 0}, tooltip: {show: false}},
          {name: 'ETD', type: 'scatter', symbolSize: 9, data: st.map(s => [s.etd, s.style_no]), itemStyle: {color: css('--s1')}},
          {name: 'Dự báo xong', type: 'scatter', symbol: 'diamond', symbolSize: 11, data: st.map(s => [s.ready_date, s.style_no]), itemStyle: {color: css('--s2')}}],
        _click: p => { const s = st.find(x => x.style_no === (p.value?.[1])); if (s) openStyle(s.style_nk); }, _cls: 'tall'})}</div>
    <div class="card"><h3>Tải nhà máy theo tuần (sản lượng) ${STATE.syn && wk.some(w => w.is_synthetic) ? synChip(['ASM-SIM-02']) : ''}</h3><p class="sub">Σ sản lượng ngày theo tuần, xếp chồng theo nhà máy; bấm để lọc nhà máy</p>
      ${chart('cLoad', {xAxis: {type: 'category', data: weeks}, yAxis: {type: 'value'}, dataZoom: [{type: 'inside'}],
        series: facs.map(f => { const g = group(wk.filter(x => x.factory_code === f), x => x.week_start, x => x.qty); return {name: f, type: 'bar', stack: 'o', data: weeks.map(w => g.get(w) || 0)}; }),
        _click: p => { STATE.factory = p.seriesName; refresh(); }, _cls: 'tall'})}</div>
  </div>`;
}

function pageShip() {
  const st = styles().filter(s => s.is_active && s.delay_days != null && (STATE.syn || !s.ship_syn));
  const bins = [-30, -14, -7, -1, 0, 3, 7, 14, 30, 60], lab = ['≤ -30', '-29…-14', '-13…-7', '-6…-1', '0', '1…3', '4…7', '8…14', '15…30', '31…60', '> 60'];
  const hist = lab.map(() => 0); st.forEach(s => { let i = bins.findIndex(b => s.delay_days <= b); if (i < 0) i = bins.length; hist[i]++; });
  const wk = T('weekly'), weeks = uniq(wk.map(w => w.week_start));
  const ws = m => { const g = group(wk.filter(x => x.measure === m), x => x.week_start, x => x.qty); return weeks.map(w => g.get(w) || 0); };
  const lots = T('lots'), modes = uniq(lots.map(l => l.ship_mode || 'UNKNOWN'));
  const ev = T('ship_events'), fw = uniq(ev.map(e => e.forwarder || '?'));
  const mat = T('material');
  return `
  <div class="grid">
    <div class="card"><h3>SL xuất theo tuần so với kế hoạch ETD ${STATE.syn && wk.some(w => w.is_synthetic && w.measure !== 'OUTPUT') ? synChip(['ASM-SIM-01', 'ASM-SIM-04']) : ''}</h3><p class="sub">cột: SL theo ETD VN (RECAP); đường: SL đã xuất theo ETD lô (Shipment Status)</p>
      ${chart('cShW', {xAxis: {type: 'category', data: weeks}, yAxis: {type: 'value'}, dataZoom: [{type: 'inside'}],
        series: [{name: 'Kế hoạch ETD', type: 'bar', data: ws('ETD_PLAN')}, {name: 'Đã xuất', type: 'bar', data: ws('SHIPPED')}]})}</div>
    <div class="card"><h3>Phân bố số ngày trễ ETD (lô đầu) ${STATE.syn && st.some(s => s.ship_syn || s.style_syn) ? synChip(['ASM-SIM-01', 'ASM-SIM-04']) : ''}</h3><p class="sub">${fmt(st.length)} style · âm = xuất sớm hơn ETD VN</p>
      ${chart('cHist', {xAxis: {type: 'category', data: lab}, yAxis: {type: 'value'}, series: [{name: 'Style', type: 'bar', data: hist.map((v, i) => ({value: v, itemStyle: {color: bins[i] > 0 || i === bins.length ? css('--critical') : css('--good')}}))}]})}</div>
  </div>
  <div class="grid">
    <div class="card"><h3>Lô theo phương thức ${STATE.syn && lots.some(l => l.is_synthetic) ? synChip(['ASM-SIM-01', 'ASM-SIM-04']) : ''}</h3><p class="sub">SL theo SEA / AIR / HC (hand carry)</p>
      ${chart('cMode', {tooltip: {trigger: 'item'}, xAxis: {show: false}, yAxis: {show: false}, series: [{type: 'pie', radius: ['40%', '68%'], data: modes.map(m => ({name: m, value: sum(lots.filter(l => (l.ship_mode || 'UNKNOWN') === m), l => l.qty)}))}]})}</div>
    <div class="card"><h3>Lô hàng trong email theo forwarder</h3><p class="sub">tiêu đề email (luật, chờ duyệt): thành phẩm đi và vật tư về</p>
      ${chart('cFw', {xAxis: {type: 'category', data: fw}, yAxis: {type: 'value'}, series: ['outbound', 'inbound_material'].map(d => ({name: d === 'outbound' ? 'Thành phẩm' : 'Vật tư về', type: 'bar', stack: 'f', data: fw.map(f => ev.filter(e => (e.forwarder || '?') === f && e.direction === d).length)}))})}</div>
  </div>
  <div class="card"><h3>Vật tư về nhà máy bị dời ETD</h3><p class="sub">nguồn: tiêu đề email "M/D->M/D ETD (delay)"</p>
    ${table('tMat', mat, [{k: 'factory_code', l: 'Nhà máy'}, {k: 'customer', l: 'Khách'}, {k: 'shipments', l: 'Lô', n: 1}, {k: 'delayed', l: 'Bị dời', n: 1},
      {k: 'avg_delay_days', l: 'TB ngày dời', n: 1}, {k: 'max_delay_days', l: 'Tối đa', n: 1}, {k: 'last_etd', l: 'ETD gần nhất'}])}</div>`;
}

function pageQuality() {
  const q = T('quality').filter(r => r.source === 'KLMAS'), tp = (D.quality || []).filter(r => r.source === 'THIRD_PARTY');
  const facs = uniq(q.map(r => r.factory_code));
  const rate = f => { const rr = q.filter(r => r.factory_code === f); const i = sum(rr, r => r.inspected); return i ? +(100 * sum(rr, r => r.defects) / i).toFixed(1) : 0; };
  const months = uniq(q.map(r => r.month));
  const par = (D.pareto || []).filter(p => STATE.syn || !p.is_synthetic);
  const src = par.some(p => p.source === 'THIRD_PARTY') ? 'THIRD_PARTY' : 'KLMAS';
  const top = Object.values(par.filter(p => p.source === src).reduce((a, p) => ((a[p.code] = a[p.code] || {code: p.code, name: p.name_ko, points: 0}).points += p.points, a), {})).sort((a, b) => b.points - a.points).slice(0, 15);
  const tot = sum(par.filter(p => p.source === src), p => p.points); let cum = 0;
  const comp = D.complaints || [];
  const tpMonths = uniq(tp.map(r => r.month));
  return `
  <div class="banner">Tỉ lệ lỗi = điểm lỗi ÷ SL đã kiểm ${synChip(['ASM-QC-01'])} (${qref('Q24')} chờ KLMAS). Bảng kiểm KLMAS có số theo nhà máy × ngày; kiểm bên thứ ba (INPUT DATA) là mảng kinh doanh khác, hiển thị riêng.</div>
  <div class="grid">
    <div class="card"><h3>Tỉ lệ lỗi theo nhà máy (đơn KLMAS) ${STATE.syn && q.some(r => r.is_synthetic) ? synChip(['ASM-SIM-01', 'ASM-SIM-03']) : ''}</h3><p class="sub">bấm để lọc nhà máy</p>
      ${chart('cQF', {grid: {left: 52, right: 16, top: 30, bottom: 64}, xAxis: {type: 'category', data: facs, axisLabel: {rotate: 30, color: css('--text-2')}}, yAxis: {type: 'value', name: '%'}, series: [{name: 'Tỉ lệ lỗi %', type: 'bar', data: facs.map(rate)}],
        _click: p => { STATE.factory = p.name; refresh(); }})}</div>
    <div class="card"><h3>Pareto mã lỗi (${src === 'THIRD_PARTY' ? 'kiểm bên thứ ba, dữ liệu thật' : 'giả định'})</h3><p class="sub">15 mã nhiều điểm lỗi nhất; đường = % cộng dồn</p>
      ${chart('cPar', {grid: {left: 52, right: 44, top: 30, bottom: 34}, xAxis: {type: 'category', data: top.map(t => t.code)}, yAxis: [{type: 'value'}, {type: 'value', max: 100, splitLine: {show: false}}],
        tooltip: {trigger: 'axis', formatter: ps => ps.map(p => `${p.seriesName}: ${nf1.format(p.value)}`).join('<br>') + '<br>' + esc((top[ps[0].dataIndex] || {}).name || '')},
        series: [{name: 'Điểm lỗi', type: 'bar', data: top.map(t => t.points)}, {name: '% cộng dồn', type: 'line', yAxisIndex: 1, data: top.map(t => +(100 * (cum += t.points) / tot).toFixed(1))}]})}</div>
  </div>
  <div class="grid">
    <div class="card"><h3>Xu hướng tỉ lệ lỗi theo tháng</h3><p class="sub">đơn KLMAS (theo bộ lọc) và kiểm bên thứ ba</p>
      ${chart('cQT', {xAxis: {type: 'category', data: uniq([...months, ...tpMonths])}, yAxis: {type: 'value', name: '%'},
        series: [{name: 'Đơn KLMAS', type: 'line', data: uniq([...months, ...tpMonths]).map(m => { const r = q.filter(x => x.month === m); const i = sum(r, x => x.inspected); return i ? +(100 * sum(r, x => x.defects) / i).toFixed(1) : null; })},
                 {name: 'Kiểm bên thứ ba', type: 'line', data: uniq([...months, ...tpMonths]).map(m => { const r = tp.filter(x => x.month === m); const i = sum(r, x => x.inspected); return i ? +(100 * sum(r, x => x.defects) / i).toFixed(1) : null; })}]})}</div>
    <div class="card"><h3>Phàn nàn chất lượng từ buyer (email)</h3><p class="sub">tiêu đề có QUALITY / 품질 / 불량</p>
      ${table('tComp', comp.filter(c => keep(c)), [{k: 'sent_at', l: 'Ngày'}, {k: 'subject', l: 'Tiêu đề'}, {k: 'party_type', l: 'Người gửi'}, {k: 'styles', l: 'Style'}], {limit: 8})}</div>
  </div>`;
}

function scoreFormula() {
  const W = IDX.weights || {}, n = {on_time: '% đúng hạn (lô đầu ≤ ETD VN)', quality: '(100 − % lỗi)', changes: '(100 − 10 × số thay đổi / 1.000 pcs)',
    freshness: 'độ tươi (FRESH 100, STALE 50, DARK 0)'};

function pageFactory() {
  const f = T('factory'), facs = uniq(f.map(r => r.factory_code));
  const rows = facs.map(code => {
    const r = f.filter(x => x.factory_code === code);
    const lots = sum(r, x => x.lots_real) + (STATE.syn ? sum(r, x => x.lots_syn) : 0), ot = sum(r, x => x.on_time_real) + (STATE.syn ? sum(r, x => x.on_time_syn) : 0);
    const ins = sum(r, x => x.insp_real) + (STATE.syn ? sum(r, x => x.insp_syn) : 0), def = sum(r, x => x.def_real) + (STATE.syn ? sum(r, x => x.def_syn) : 0);
    const qty = sum(r, x => x.qty), changes = sum(r, x => x.changes);
    const otP = lots ? 100 * ot / lots : null, defP = ins ? 100 * def / ins : null, chg = qty ? 1000 * changes / qty : null;
    const fr = r.map(x => x.freshness).filter(Boolean), fresh = fr.includes('FRESH') ? 100 : fr.includes('STALE') ? 50 : 0;
    const W = IDX.weights || {}, parts = [['on_time', otP], ['quality', defP == null ? null : Math.max(0, 100 - defP)],
      ['changes', chg == null ? null : Math.max(0, 100 - chg * 10)], ['freshness', fresh]].filter(([k, v]) => v != null && (W[k] ?? 1) > 0);
    const wsum = sum(parts, ([k]) => W[k] ?? 1);
    return {factory_code: code, styles: sum(r, x => x.styles), qty, otP, defP, changes, chg, freshness: fr.includes('FRESH') ? 'FRESH' : fr.includes('STALE') ? 'STALE' : fr.length ? 'DARK' : 'chưa có báo cáo', risk: sum(r, x => x.risk_styles),
      score: wsum ? sum(parts, ([k, v]) => (W[k] ?? 1) * v) / wsum : null, syn: r.some(x => x.lots_syn || x.insp_syn),
      _src: 'Đúng hạn: Shipment Status vs ORDER RECAP · Lỗi: bảng kiểm KLMAS · Thay đổi: ghi chú + các bản RECAP · Độ tươi: báo cáo ngày'};
  }).sort((a, b) => (b.score ?? -1) - (a.score ?? -1));

  <div class="card"><h3>Scorecard nhà máy ${STATE.syn && rows.some(r => r.syn) ? synChip(['ASM-SIM-01', 'ASM-SIM-03', 'ASM-SIM-04']) : ''} ${qchip('Q21')}</h3>

      {k: 'otP', l: 'Đúng hạn %', n: 1}, {k: 'defP', l: 'Lỗi %', n: 1}, {k: 'changes', l: 'Thay đổi', n: 1}, {k: 'freshness', l: 'Độ tươi'},

  <div class="card" style="margin-top:12px"><h3>Sản lượng theo tuần từng nhà máy</h3><p class="sub">mỗi ô một nhà máy, cùng thang thời gian</p>

  if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  try {
    IDX = await getJSON('data/mgr/index.json'); COMMON = await getJSON('data/mgr/_common.json');
  } catch (err) {
    $('#main').innerHTML = `<div class="banner">Trang này tải dữ liệu từ <b>data/mgr/</b>: chạy <code>python -m kops_dw serve</code> (hoặc <code>make up</code>) rồi mở <b>http://127.0.0.1:8765/</b>.<br><span class="note">${esc(err.message)}</span></div>`; return;
  }
  COMMON_ROWS = Object.fromEntries(Object.entries(COMMON).map(([k, t]) => [k, rowsOf(t)]));
  $('#built').textContent = 'build ' + IDX.built_at;
  STATE.syn = q.get('syn') != null ? q.get('syn') === '1' : !!IDX.sim;
  let saved = null; try { saved = localStorage.getItem('kops.mgr.season'); } catch {}
  const want = q.get('season') === 'all' ? ALL : q.get('season') || saved;    // URL, then this viewer's last choice, then the running season
  STATE.season = want === ALL || IDX.seasons.includes(want) ? want : IDX.default;
  for (const k of ['customer', 'factory']) if (q.get(k)) STATE[k] = q.get(k);
  try { STATE.tab = q.get('tab') || localStorage.getItem('kops.mgr.tab') || 'actions'; } catch { STATE.tab = q.get('tab') || 'actions'; }
  if (!VIEW[STATE.tab]) STATE.tab = 'actions';
  if (q.get('style')) STATE.style = q.get('style');
  await refresh();
  document.body.dataset.loadMs = Math.round(performance.now());
})();
</script>
</body>
