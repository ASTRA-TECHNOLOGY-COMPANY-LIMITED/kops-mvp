<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KOPS</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#16191d;--text-2:#555d68;--line:#c9ced6;--accent:#2f5bd3;--critical:#c0362c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--surface:#191d22;--text:#e8ebef;--text-2:#a3abb5;--line:#3c444d;--accent:#7b9cf0;--critical:#ef6b61;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{max-width:360px;margin:12vh auto 0;padding:0 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
h1{font-size:20px;margin:0 0 16px}label{display:block;margin:10px 0 4px;color:var(--text-2)}
input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
button{margin-top:16px;width:100%;padding:9px;border:0;border-radius:6px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--critical);min-height:20px;margin-top:10px}
</style>
</head>
<body>
<main>
  <form id="f">
    <h1>KOPS</h1>
    <label for="u">Tên đăng nhập</label><input id="u" autocomplete="username" required>
    <label for="p">Mật khẩu</label><input id="p" type="password" autocomplete="current-password" required>
    <button type="submit">Đăng nhập</button>
    <div class="err" id="err"></div>
  </form>
</main>
<script>
'use strict';
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: document.getElementById('u').value, password: document.getElementById('p').value})});
  if (r.ok) { const n = new URLSearchParams(location.search).get('next'); location.href = n && n.startsWith('/') && !n.startsWith('//') ? n : '/'; }
  else document.getElementById('err').textContent = 'Sai tên đăng nhập hoặc mật khẩu';
};
</script>
</body>
</html>
